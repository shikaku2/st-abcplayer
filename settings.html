<div class="abc-music-player-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>ABC Music Player</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label">
                <input id="abc_player_enabled" type="checkbox" />
                <span>Enable ABC Music Player</span>
            </label>
            <label class="checkbox_label">
                <input id="abc_player_autorender" type="checkbox" />
                <span>Auto-render on message received</span>
            </label>
            <label class="checkbox_label">
                <input id="abc_player_show_notation" type="checkbox" />
                <span>Show sheet music notation</span>
            </label>
            <div class="flex-container">
                <label for="abc_player_tempo">Tempo multiplier</label>
                <input id="abc_player_tempo" type="number" class="text_pole" min="0.25" max="4.0" step="0.25" style="width:80px;" />
            </div>
            <div class="flex-container">
                <label for="abc_player_mp3_bitrate">MP3 quality (kbps)</label>
                <select id="abc_player_mp3_bitrate" class="text_pole" style="width:80px;">
                    <option value="64">64</option>
                    <option value="96">96</option>
                    <option value="128">128</option>
                    <option value="192">192</option>
                    <option value="256">256</option>
                    <option value="320">320</option>
                </select>
            </div>
            <small style="color: var(--SmartThemeEmColor); display:block; margin-top:4px;">
                Renders <code>```abc</code> code blocks as interactive sheet music with playback and download.
            </small>
        </div>
    </div>
</div>
